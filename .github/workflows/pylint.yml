name: Pylint Audit

# Triggers on normal pushes, but ignores tags so it doesn't run twice during a release
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Target modern Linux environments (Debian 12 uses 3.11, Ubuntu 24.04 uses 3.12)
        python-version: ["3.10", "3.11", "3.12"] 
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5  # Upgraded from v3 to v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint pytest
        
    - name: Analysing the code with pylint
      # -d C,R disables strict Conventions (style) and Refactoring (complexity) rules
      # This ensures the pipeline only fails on actual Errors (E) and Warnings (W)
      run: |
        pylint -d C,R $(git ls-files '*.py')
